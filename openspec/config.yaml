schema: spec-driven

context: |
  ASTRODUST — браузерная 2D пиксельная игра: космонавт садится на небесное
  тело, копает полностью разрушаемый мир и перерабатывает породу в фабрику.
  Жанр — Noita × Factorio.

  Стек: TypeScript + Vite, рендер в <canvas> через ImageData с целочисленным
  апскейлом, звук — Web Audio API. РАНТАЙМ-ЗАВИСИМОСТЕЙ НЕТ И НЕ ДОБАВЛЯЕМ:
  всё игровое написано руками. Из дев-зависимостей только vite, typescript,
  esbuild, prettier, playwright.

  Язык кода, комментариев, спек, задач и общения — РУССКИЙ.

  Устройство. Мир — плоский Uint8Array, ячейка хранит id материала; это
  единственный источник правды о геометрии, по нему же считается коллизия
  и строится картинка. Отдельного тайлмапа нет. Свойства веществ лежат
  в типизированных таблицах и выбираются по агрегатному состоянию, поэтому
  новое вещество — это строка таблицы, а не правка автомата.

  Ключевые инварианты:
  - порядок обновлений в шаге: переключатели → инструменты → персонаж →
    клеточный автомат → машины → приёмник → камера → звук → закрытие ввода;
  - симуляция детерминирована, Math.random() в ней запрещён — вариативность
    берётся из номера шага;
  - шаг фиксированный, 60 Гц, независимо от частоты кадров;
  - blocksPlayer и правила движения вещества — разные вещи.

  Проверки: npm run typecheck и npm test (Node, без браузера) обязательны;
  npm run bench — стоимость кадра, npm run shot — скриншоты с числовыми
  метриками, npm run verify:audio — офлайн-проверка звука.

  Спека — источник правды о поведении и о том, ПОЧЕМУ оно такое. Обоснование
  поведения пишется в спеку, а не в комментарий к коду; в коде остаётся
  контракт и обоснование реализации. Подробнее — CLAUDE.md в корне.


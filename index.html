<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRODUST — Луна</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /*
         * Срезает свес канваса за край окна. Канвас берётся не меньше окна
         * (core/display.ts), поэтому свес — до одного экранного множителя
         * по правому и нижнему краю, и без обрезки он дал бы полосы прокрутки.
         */
        overflow: hidden;
        background: #090a14;
      }

      /*
       * Канвас растягивается через width/height в CSS-пикселях и покрывает окно
       * целиком. Центрировать нечего: незанятой области вокруг кадра нет.
       *
       * image-rendering здесь НЕТ: буфер канваса экранный (core/display.ts),
       * браузеру нечего интерполировать, а pixelated рубил бы сглаженный текст
       * интерфейса на дробной плотности экрана. Квадратность пикселя мира
       * держит imageSmoothingEnabled = false при выводе буфера.
       */
      #game {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        cursor: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
